<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airport Investment Intelligence Agent</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 1.5rem; }
  h1 { font-size: 1.1rem; opacity: 0.7; font-weight: 600; }
  #layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1rem; align-items: start; }
  @media (max-width: 700px) { #layout { grid-template-columns: 1fr; } }
  #chat, #tool-log { border: 1px solid #8884; border-radius: 8px; padding: 0.75rem; height: 60vh; overflow-y: auto; }
  .msg { margin-bottom: 0.75rem; }
  .msg .role { font-weight: 600; font-size: 0.85rem; opacity: 0.6; }
  .msg.user .role { color: #2563eb; }
  .msg.agent .role { color: #16a34a; }
  .msg .content { white-space: pre-wrap; }
  #tool-log h2 { font-size: 0.9rem; margin: 0 0 0.5rem; opacity: 0.7; }
  .tool-entry { border-left: 3px solid #f59e0b; padding-left: 0.5rem; margin-bottom: 0.75rem; font-size: 0.85rem; }
  .tool-entry.error { border-left-color: #dc2626; }
  .tool-entry .name { font-weight: 600; }
  .tool-entry pre { white-space: pre-wrap; word-break: break-word; margin: 0.25rem 0 0; font-size: 0.78rem; opacity: 0.85; }
  #input-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  #input { flex: 1; padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  #status { font-size: 0.8rem; opacity: 0.6; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<h1>Airport Investment Intelligence Agent</h1>
<div id="status">loading...</div>
<div id="layout">
  <div id="chat"></div>
  <div id="tool-log"><h2>Tool-call log (agent reasoning/tool-use)</h2><div id="tool-log-entries"></div></div>
</div>
<div id="input-row">
  <input id="input" type="text" placeholder="Try: which airports in New England are strong candidates for terminal expansion?" autofocus />
  <button id="send">Send</button>
  <button id="reset" title="Clear conversation history">Reset</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const toolLogEl = document.getElementById('tool-log-entries');
const inputEl = document.getElementById('input');
const statusEl = document.getElementById('status');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="role">${role}</div><div class="content"></div>`;
  div.querySelector('.content').textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addToolLogEntry(entry) {
  const div = document.createElement('div');
  div.className = 'tool-entry' + (entry.error ? ' error' : '');
  const argsStr = JSON.stringify(entry.arguments);
  const resultStr = JSON.stringify(entry.result, null, 2);
  div.innerHTML = `<div class="name">${entry.tool_name}(${argsStr})</div><pre></pre>`;
  div.querySelector('pre').textContent = entry.error ? `ERROR: ${entry.error}` : resultStr;
  toolLogEl.appendChild(div);
  toolLogEl.scrollTop = toolLogEl.scrollHeight;
}

async function loadHealth() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    statusEl.textContent = `provider: ${data.provider} / model: ${data.model}`;
  } catch (e) {
    statusEl.textContent = 'could not reach backend — is uvicorn running?';
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMessage('user', text);
  statusEl.textContent = 'thinking...';
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    for (const entry of (data.tool_log || [])) addToolLogEntry(entry);
    addMessage('agent', data.reply);
  } catch (e) {
    addMessage('agent', '(error contacting backend — see console)');
    console.error(e);
  } finally {
    loadHealth();
  }
}

document.getElementById('send').addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
document.getElementById('reset').addEventListener('click', async () => {
  await fetch('/reset', { method: 'POST' });
  chatEl.innerHTML = '';
  toolLogEl.innerHTML = '';
});

loadHealth();
</script>
</body>
</html>
